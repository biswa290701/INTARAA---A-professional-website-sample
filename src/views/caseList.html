<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }

        /* NAV BAR */
        .navbar {
            background: #333;
            padding: 12px 20px;
            display: flex;
            justify-content: flex-start;
            gap: 15px;
        }

        .navbar button {
            background: #555;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }

        .navbar button:hover {
            background: #777;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table th, table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        table th {
            background: #333;
            color: white;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        .loader {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .top-bar button {
            padding: 10px 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <div class="navbar">
        <button onclick="location.href='/caselist'">Case List</button>
        <button onclick="location.href='/chatlog'">Chat Log</button>
        <button onclick="location.href='/logout'">Logout</button>
    </div>

    <h1>All Cases</h1>

    <div class="container">
        <div id="loader" class="loader">Loading cases...</div>
        <div id="error" class="error"></div>

        <div class="top-bar">
            <button onclick="location.href='/caseUpload'">Add New Case</button>
        </div>

        <table id="caseTable" style="display:none;">
            <thead>
                <tr>
                    <th>Case ID</th>
                    <th>Case Description</th>
                    <th>Voice Id</th>
                </tr>
            </thead>
            <tbody id="caseBody"></tbody>
        </table>
    </div>

    <script>
        async function loadCases() {
            try {
                const res = await fetch("/cases", { method: "POST" });
                const data = await res.json();

                if (!data.success) {
                    document.getElementById("error").innerText = "Failed to load cases";
                    return;
                }

                const tbody = document.getElementById("caseBody");

                data.cases.forEach(c => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${c.CaseId}</td>
                        <td>${c.CasePrompt || "—"}</td>
                        <td>${c.CaseVoiceId || "—"}</td>
                    `;

                    tbody.appendChild(row);
                });

                document.getElementById("loader").style.display = "none";
                document.getElementById("caseTable").style.display = "table";

            } catch (e) {
                document.getElementById("loader").style.display = "none";
                document.getElementById("error").innerText = "Error loading cases: " + e.message;
            }
        }

        loadCases();
    </script>

</body>
</html>
