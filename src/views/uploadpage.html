<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Case</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f7f7f7;
      }

      .container {
        max-width: 600px;
        margin: auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 4px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-size: 1rem;
      }

      textarea {
        resize: vertical;
        min-height: 100px;
      }

      button {
        margin-top: 20px;
        padding: 12px 20px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
      }

      button:hover {
        background: #218838;
      }

      .back-link {
        display: inline-block;
        margin-top: 15px;
        text-decoration: none;
        color: #007bff;
      }

      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Upload Case Data</h1>

      <form method="POST" id="uploadCaseForm">
        <label for="CasePrompt"
          >Case Prompt <span style="color: red">*</span></label
        >
        <textarea id="CasePrompt" name="CasePrompt" required></textarea>

        <label for="CaseVoiceId">Case Voice ID (Optional)</label>
        <input
          type="text"
          id="CaseVoiceId"
          name="CaseVoiceId"
          placeholder="21m00Tcm4TlvDq8ikWAM"
        />

        <button type="submit">Upload Case</button>
      </form>

      <a href="/caseList" class="back-link">← Back to Case List</a>
      <div id="response"></div>
    </div>
  </body>

  <script>
    document
      .getElementById("uploadCaseForm")
      .addEventListener("submit", async function (e) {
        e.preventDefault(); // prevent page change

        const formData = new FormData(this);

        const response = await fetch("/caseUpload", {
          method: "POST",
          body: formData,
        });

        const result = await response.json();

        // Show server response on the same page
        document.getElementById("response").innerText = result.message;
      });
  </script>
</html>
