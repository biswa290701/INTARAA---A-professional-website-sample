<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – INTARAA</title>

    <link rel="stylesheet" href="css/forgot.css">

</head>

<body>

    <header class="navbar">
        <h1 class="logo"><a href="index.html">INTARAA</a></h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="signin.html">Sign In</a></li>
        </ul>
    </header>

    <div class="forgot-page-bg">
        <div class="forgot-box">
            <h2>Forgot Password</h2>

            <form id="forgotForm">
                <label for="email">Enter your registered email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <button type="submit">Send Reset Link</button>
            </form>

            <div class="back-link">
                <p><a href="signin.html">Back to Sign In</a></p>
            </div>
        </div>
    </div>

    <!-- UNIVERSAL SUCCESS DIALOG -->
    <div id="successDialog" class="dialog" style="display:none;">
    <div class="dialog-box">
        <h3>Success</h3>
        <p id="successMessage"></p>
        <button onclick="closeSuccessDialog()">OK</button>
    </div>
    </div>

    <script>
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const btn = e.target.querySelector("button");
        btn.disabled = true;
        btn.textContent = "Processing...";

        const email = document.getElementById("email").value;

        const response = await fetch("/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });

        const result = await response.json();

        if (result.error) {
            showSuccessDialog(result.error);
        } else {
            showSuccessDialog(
                "A password reset link has been sent to your email.",
                "signin.html"
            );
        }
    });

    function showSuccessDialog(message, redirect = null) {
        document.getElementById("successMessage").textContent = message;
        document.getElementById("successDialog").style.display = "flex";

        window._afterDialogRedirect = redirect;
    }

    function closeSuccessDialog() {
        document.getElementById("successDialog").style.display = "none";

        const btn = document.querySelector("#forgotForm button");
        if (btn) {
            btn.disabled = false;
            btn.textContent = "Send Reset Link";
        }

        if (window._afterDialogRedirect) {
            window.location.href = window._afterDialogRedirect;
        }
    }
    </script>


</body>
</html>
