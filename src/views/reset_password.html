<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – INTARAA</title>

    <link rel="stylesheet" href="css/reset.css">
</head>

<body>

    <header class="navbar">
        <h1 class="logo">INTARAA</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="signin.html">Sign In</a></li>
        </ul>
    </header>

    <div class="reset-page-bg">
        <div class="reset-box">
            <h2>Reset Password</h2>

            <form id="resetForm">

                <input type="hidden" id="token" name="token" value="">

                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="Enter new password" required>

                <label for="confirm">Confirm New Password</label>
                <input type="password" id="confirm" name="confirm" placeholder="Re-enter new password" required>

                <button type="submit">Reset Password</button>
            </form>

            <div class="back-link">
                <p><a href="signin.html">Back to Sign In</a></p>
            </div>
        </div>
    </div>

    <!-- UNIVERSAL SUCCESS DIALOG -->
    <div id="successDialog" class="dialog" style="display:none;">
    <div class="dialog-box">
        <h3>Success</h3>
        <p id="successMessage"></p>
        <button onclick="closeSuccessDialog()">OK</button>
    </div>
    </div>


<script>
// Extract token from URL
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get("token");
document.getElementById("token").value = token;

// Handle Reset Password submit
document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const token = document.getElementById("token").value;
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    const response = await fetch("/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password, confirm })
    });

    const result = await response.json();

    if (result.error) {
        showSuccessDialog(result.error);
    } else {
        showSuccessDialog("Your password has been reset successfully!", "signin.html");
    }

});

    function showSuccessDialog(message, redirect = null) {
        document.getElementById("successMessage").textContent = message;
        document.getElementById("successDialog").style.display = "flex";

        window._afterDialogRedirect = redirect; // store redirect for after clicking OK
    }

    function closeSuccessDialog() {
        document.getElementById("successDialog").style.display = "none";

        if (window._afterDialogRedirect) {
            window.location.href = window._afterDialogRedirect;
        }
    }

</script>

</body>
</html>
